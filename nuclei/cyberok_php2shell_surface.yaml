id: cyberok-php2shell-surface

info:
  name: CyberOK php2shell attack surface + post-exploit detection
  author: CyberOK
  severity: high
  description: |
    Multi-check template covering the php2shell attack surface:

    1. Version-based: reads X-Powered-By for PHP version and matches
       against UNPATCHED versions using regex with numeric word-boundaries
       (not substring — PHP/8.2.3 must NOT match PHP/8.2.35).
    2. LFI trigger: checks if a parameter reflects session-file content.
    3. Post-exploit IoCs: webshell access and response markers.
    4. Response-side session decode failure.

    Note: version-based check has known limitations — distro backports
    (Debian/Ubuntu/RHEL) may patch without changing the version string.
    A "vulnerable version" result should be verified behaviourally.
  reference:
    - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
    - https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
    - https://github.com/cyberok-org/php2shell
  tags: php,rce,cve-2026,cyberok,surface,lfi

http:
  # --- Check 1: unpatched version via regex (word-boundary, not substring) ---
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: or
    matchers:
      # PHP 8.2: 8.2.0–8.2.34 are unpatched (fixed in 8.2.35)
      # Pattern: PHP/8.2.<0-29> NOT followed by another digit
      #          PHP/8.2.3[0-4] NOT followed by another digit
      - type: regex
        part: header
        regex:
          - 'PHP/8\.2\.(?:[0-9]|[12][0-9]|3[0-4])(?:[^0-9]|$)'
          - 'PHP/8\.3\.(?:[0-9]|[12][0-9]|3[0-5])(?:[^0-9]|$)'
          - 'PHP/8\.4\.(?:[0-9]|1[0-9]|2[0-6])(?:[^0-9]|$)'
          - 'PHP/8\.5\.(?:[0-9]|1[01])(?:[^0-9]|$)'
          - 'PHP/[5-7]\.'

  # --- Check 2: LFI trigger (session-file path reflected) ---
  - raw:
      - |
        GET /?tpl=/tmp/sess_cyberok_test HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /?template=/tmp/sess_cyberok_test HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /?view=/tmp/sess_cyberok_test HTTP/1.1
        Host: {{Hostname}}

    stop-at-first-match: false

    matchers:
      # Match the SPECIFIC content we injected (not generic "sess_")
      - type: word
        part: body
        words:
          - "upload_progress_cyberok_test"
        condition: and

  # --- Check 3: post-exploit webshell IoC ---
  - raw:
      - |
        GET /p2s_8512_shell.php HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        part: body
        words:
          - "SHELL_ALIVE"
          - "PAYLOAD_PERSISTED"
        condition: or

  # --- Check 4: response-side session decode failure ---
  - raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}
        Cookie: PHPSESSID=_
        Content-Type: multipart/form-data; boundary=--cyberok

        ----cyberok
        Content-Disposition: form-data; name="PHP_SESSION_UPLOAD_PROGRESS"

        cyberok_test
        ----cyberok
        Content-Disposition: form-data; name="f"; filename="a.txt"
        Content-Type: text/plain

        1
        ----cyberok--

    matchers:
      - type: word
        part: body
        words:
          - "Failed to write session data"
        condition: and
