id: cyberok-php2shell-behavioural

info:
  name: CyberOK php2shell behavioural detection (CVE-2026-109618/109619)
  author: CyberOK
  severity: critical
  description: |
    Non-destructive behavioural check for the PHP "php2shell" vulnerabilities
    (CVE-2026-109618, CVE-2026-109619, CVSS v4.0 9.2).

    Technique: sends ONE POST with an invalid session ID (Cookie: PHPSESSID=_)
    and a PHP_SESSION_UPLOAD_PROGRESS field. On a vulnerable build PHP prints
    THREE warnings including "Failed to write session data" — behaviour the
    fix removes. On a patched build only two warnings appear.

    Credit: the invalid-SID technique is from PortSwigger's BCheck by Tom SL.
    The phpMyAdmin retest path is from Assetnote's scanner.

    Affected: PHP 8.2 < 8.2.35, 8.3 < 8.3.36, 8.4 < 8.4.27, 8.5 < 8.5.12.
    All EOL branches (5.6 through 8.1) are affected as well — verified by
    direct testing against 5.6.40 / 7.0.33 / 7.2.34 / 7.3.33 / 7.4.33 /
    8.0.30 / 8.1.34.
  reference:
    - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
    - https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
    - https://github.com/cyberok-org/php2shell
  classification:
    cvss-metrics: CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H
    cvss-score: 9.2
    cve-id: CVE-2026-109618,CVE-2026-109619
  tags: php,rce,cve-2026,cyberok

variables:
  boundary: "----cyberok{{rand_base(16)}}"

http:
  - raw:
      - |
        POST /{{path}} HTTP/1.1
        Host: {{Hostname}}
        Cookie: PHPSESSID=_
        Content-Type: multipart/form-data; boundary={{boundary}}

        --{{boundary}}
        Content-Disposition: form-data; name="PHP_SESSION_UPLOAD_PROGRESS"

        {{rand_base(20)}}
        --{{boundary}}
        Content-Disposition: form-data; name="f"; filename="{{rand_base(8)}}.txt"
        Content-Type: text/plain

        1
        --{{boundary}}--

    payloads:
      path:
        - ""
        - "index.php"
        - "show_config_errors.php"

    stop-at-first-match: false

    matchers-condition: and
    matchers:
      # w1 text differs across PHP generations ("Session ID ..." >= 8.0 vs
      # "The session id ..." on 7.x/5.6) — match case-insensitively.
      - type: word
        part: body
        case-insensitive: true
        words:
          - "session id is too long or contains illegal characters"
      # w3 is the decisive signal (unpatched attempts the write after the
      # start-up failure). On 5.6 the read-failure warning never fires, so
      # it is intentionally NOT required. On PHP <= 7.4 these RINIT-time
      # warnings reach the response only with display_startup_errors=On.
      - type: word
        part: body
        case-insensitive: true
        words:
          - "failed to write session data"

    extractors:
      - type: regex
        name: php_version
        part: header
        regex:
          - 'PHP/(\d+\.\d+\.\d+)'
        internal: true

      - type: regex
        name: matched_path
        part: body
        regex:
          - '(Failed to write session data)'
