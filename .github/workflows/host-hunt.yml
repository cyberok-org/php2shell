name: Host-hunt regression tests

on:
  push:
    paths:
      - 'host-hunt/**'
      - '.github/workflows/host-hunt.yml'
  pull_request:
    paths:
      - 'host-hunt/**'
      - '.github/workflows/host-hunt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install YARA binding
        run: python -m pip install -r host-hunt/requirements.txt
      - name: Run offline regression tests
        run: python -m unittest discover -s host-hunt -p 'test_*.py' -v
