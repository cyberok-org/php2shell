# ModSecurity (v2/v3, OWASP CRS-compatible) rules — PHP-UP-2026 wave
# CVE-2026-109618 (OOM corruption) + CVE-2026-109619 (stale global state /
# session upload-progress consumer). IDs 1006100-1006199 (local range).
#
# Defaults: SecRuleEngine must be On/DetectionOnly per your policy; these rules
# use "block" — switch to "log,auditlog" first if you prefer a burn-in period.
# Requires request-body parsing enabled (SecRequestBodyAccess On).

SecRequestBodyAccess On

# --- CVE-2026-109618 -----------------------------------------------------------

# Vector A: chunked multipart POST (no usable Content-Length for PHP's
# post_max_size check). Header phase — cheap, high signal.
SecRule REQUEST_HEADERS:Content-Type "@rx ^multipart/form-data(?i)" \
    "id:1006101,phase:1,deny,status:406,log,auditlog,msg:'PHP-UP-2026 CVE-2026-109618: chunked multipart POST (post_max_size bypass surface)',tag:'CVE-2026-109618',chain"
    SecRule REQUEST_HEADERS:Transfer-Encoding "@contains chunked" \
        "t:none"

# Vector B: part-header amplification — 100+ consecutive custom part headers
# inside the raw body (validated shape: 150k X-Pad lines; in-memory cost far
# exceeds wire size).
SecRule REQUEST_BODY "@rx (?i)(\r\nX-[a-z0-9-]{1,32}:[^\r\n]{0,256}){100,}" \
    "id:1006102,phase:2,block,log,auditlog,msg:'PHP-UP-2026 CVE-2026-109618: multipart part-header amplification',tag:'CVE-2026-109618'"

# Auxiliary shapes from the upstream regression corpus:
# deeply nested variable names (40+ bracket groups)
SecRule ARGS_NAMES|REQUEST_BODY "@rx (name=\"[^\"]{0,64}(\[[^\]]{0,32}\]){40,}|[a-z][a-z0-9_]{0,32}(\[[^\]]{0,32}\]){40,}=)" \
    "id:1006103,phase:2,block,log,auditlog,msg:'PHP-UP-2026 CVE-2026-109618: deeply nested input names',tag:'CVE-2026-109618'"
# empty-filename control flood (bypasses max_file_uploads accounting)
SecRule REQUEST_BODY "@rx (filename=.'.'\r\nContent-Type[^\r\n]{0,80}\r\n\r\n(?:\r\n)?--[^\r\n]{0,80}\r\nContent-Disposition[^\r\n]{0,160}; ){50,}" \
    "id:1006104,phase:2,block,log,auditlog,msg:'PHP-UP-2026 CVE-2026-109618: empty-filename multipart flood',tag:'CVE-2026-109618'"
# absolute count of empty filenames via the parser when available
SecRule &FILES "@ge 300" \
    "id:1006105,phase:2,block,log,auditlog,msg:'PHP-UP-2026 CVE-2026-109618: abnormal file-part count',tag:'CVE-2026-109618'"

# --- CVE-2026-109619 -----------------------------------------------------------

# The core poisoning rule: serialized-object / PHP-open-tag material inside the
# upload-progress VALUE. The value becomes a $_SESSION key verbatim, so any
# serializer metasyntax here is an attack, never legitimate form input.
SecRule ARGS:PHP_SESSION_UPLOAD_PROGRESS "@rx (<\?=|<\?php|O:[0-9]{1,5}:\"|a:[0-9]{1,6}:\{|[a-z]:[0-9]{1,6}:\{|\|[a-z]:[0-9])" \
    "id:1006111,phase:2,block,log,auditlog,msg:'PHP-UP-2026 CVE-2026-109619: serialized payload in PHP_SESSION_UPLOAD_PROGRESS (session poisoning)',tag:'CVE-2026-109619'"

# Second carrier: the payload inside a multipart FILENAME (stored verbatim in
# the upload-progress structure and re-serialized into the session file).
SecRule FILES|REQUEST_BODY "@rx (filename=\"[^\"]{0,512}?(<\?=|<\?php|O:[0-9]{1,5}:\"))" \
    "id:1006112,phase:2,block,log,auditlog,msg:'PHP-UP-2026 CVE-2026-109619: payload in multipart filename',tag:'CVE-2026-109619'"

# Session id supplied as a multipart FORM FIELD (cookie-less sid control used
# by the poisoning chain). Session ids never legitimately arrive as form args.
# Residual-surface note (verified 2026-10-21): form-SID ingestion SURVIVES the
# 8.2.35 fix (with cleanup=0, progress still lands in the chosen sess_<sid>);
# keep this rule enabled on patched versions. Sid traversal is closed by the
# [A-Za-z0-9,-] charset validator on both versions.
SecRule ARGS_NAMES "@streq PHPSESSID" \
    "id:1006113,phase:2,block,log,auditlog,msg:'PHP-UP-2026: PHPSESSID supplied as form field (sid injection)',tag:'CVE-2026-109619'"

# Defence-in-depth for the whole class: PHP open tag anywhere in a request body
# (starts in DetectionOnly-friendly severity; tune per your forms).
SecRule REQUEST_BODY "@contains <?php" \
    "id:1006114,phase:2,block,log,auditlog,msg:'PHP-UP-2026: PHP open tag in request body',tag:'CVE-2026-109619',severity:'WARNING'"

# Heap-grooming: multipart part flood (>500 parts). The exploit chain sends
# 1000+ parts per request to shape the ZendMM heap. The raw regex counts
# consecutive Content-Disposition lines in the body.
# Part-flood: detect abnormal multipart part count.
# NOTE: &ARGS counts form fields only; &FILES counts file uploads only.
# No single ModSec variable counts total parts. Two rules with lower
# thresholds catch the combined case (e.g. 300 fields + 250 uploads
# triggers neither @ge 500 individually, so each is set to @ge 300).
SecRule &ARGS "@ge 300" \
    "id:1006115,phase:2,block,log,auditlog,msg:'PHP-UP-2026: multipart field flood (300+ form fields)',tag:'CVE-2026-109618'"
SecRule &FILES "@ge 300" \
    "id:1006127,phase:2,block,log,auditlog,msg:'PHP-UP-2026: multipart file flood (300+ files)',tag:'CVE-2026-109618'"

# Handler-mismatch seed: pipe+serialized prefix in upload-progress value
SecRule ARGS:PHP_SESSION_UPLOAD_PROGRESS "@rx ^\|[a-z]:" \
    "id:1006116,phase:2,block,log,auditlog,msg:'PHP-UP-2026: handler-mismatch seed (pipe+serialized in upload-progress)',tag:'CVE-2026-109619'"

# Set-Cookie leak oracle: PHPSESSID response value >200 bytes or containing
# non-conforming bytes (heap pointers leaked through the session id)
SecRule RESPONSE_HEADERS:Set-Cookie "@rx PHPSESSID=[^;\s]{200,}" \
    "id:1006117,phase:3,block,log,auditlog,msg:'PHP-UP-2026: Set-Cookie PHPSESSID leak oracle (oversized)',tag:'CVE-2026-109618'"

# Giant multipart filename (>64KB): heap-exhaustion arm
SecRule FILES_NAMES|REQUEST_BODY "@rx filename=\"[^\r\n]{65536}" \
    "id:1006118,phase:2,block,log,auditlog,msg:'PHP-UP-2026: giant multipart filename (heap exhaustion)',tag:'CVE-2026-109618'"

# Response-side behavioural detection (PortSwigger technique):
# A POST with Cookie: PHPSESSID=_ + upload_progress triggers three warnings
# on vulnerable builds; the fix removes the "Failed to write" warning.
# Phase 4 (response body inspection) — requires SecResponseBodyAccess On.
SecRule RESPONSE_BODY "@rx (?s)(Session ID is too long or contains illegal characters.*Failed to read session data.*Failed to write session data)" \
    "id:1006120,phase:4,block,log,auditlog,msg:'PHP-UP-2026: behavioural CVE detection — unpatched PHP attempted session write after start-up failure',tag:'CVE-2026-109618',tag:'CVE-2026-109619',severity:'CRITICAL'"

# ==========================================================================
# TROUBLESHOOTING: statuses that are NOT crash signals (Assetnote taxonomy)
#
# The following HTTP statuses from probes indicate edge-level rejection
# (WAF, CDN, load balancer, or application routing), NOT a PHP crash:
#   400 (Bad Request), 403 (Forbidden), 411 (Length Required),
#   413 (Payload Too Large), 414 (URI Too Long), 417 (Expectation Failed),
#   422 (Unprocessable), 429 (Too Many Requests), 431 (Headers Too Large)
#
# FPM-specific crash signals (for monitoring/alerting):
#   - 502/503/504 from the web server fronting PHP-FPM (worker died)
#   - HTTP 200 with empty body when the control request had content
#   mod_php crash signals:
#   - HTTP 500 with empty body
#   - In-band "Allowed memory size...exhausted...in Unknown" in the response
# ==========================================================================

# Generic anomaly: PHP_SESSION_UPLOAD_PROGRESS field present at all
# (low severity — tune to your application's baseline)
SecRule ARGS_NAMES|REQUEST_BODY "@contains PHP_SESSION_UPLOAD_PROGRESS" \
    "id:1006119,phase:2,pass,log,auditlog,msg:'PHP-UP-2026 anomaly: PHP_SESSION_UPLOAD_PROGRESS field present',tag:'CVE-2026-109618',severity:'NOTICE'"

# Invalid PHPSESSID cookie: PHP session IDs use [a-zA-Z0-9,-] charset.
# Catches PHPSESSID=_ (PortSwigger technique) and any other crafted value.
SecRule REQUEST_COOKIES:PHPSESSID "!@rx ^[a-zA-Z0-9,-]{1,128}$" \
    "id:1006121,phase:1,block,log,auditlog,msg:'PHP-UP-2026: invalid PHPSESSID cookie value (charset violation)',tag:'CVE-2026-109618'"

# --- LFI trigger: session-file path in request args (tpl/template/view/page/file) ---
SecRule ARGS "@rx (?:/(?:tmp|var/lib/php|var/www)/(?:sessions?/|sess/)?|/tmp/)sess_[a-zA-Z0-9,-]{6,}" \
    "id:1006122,phase:2,block,log,auditlog,msg:'PHP-UP-2026: session-file path in request args (LFI trigger)',tag:'CVE-2026-109619'"

# --- response-side: OOM success (phase 4) ---
SecRule RESPONSE_BODY "@rx Allowed memory size.{1,50}exhausted" \
    "id:1006123,phase:4,pass,log,auditlog,msg:'PHP-UP-2026: OOM in response (memory exhausted)',tag:'CVE-2026-109618',severity:'WARNING'"

# --- response-side: session destruction failure (phase 4) ---
SecRule RESPONSE_BODY "@rx (Session object destruction failed|Failed to decode session object)" \
    "id:1006124,phase:4,pass,log,auditlog,msg:'PHP-UP-2026: session decode failure in response (stale state)',tag:'CVE-2026-109619',severity:'WARNING'"

# --- post-exploit IoCs ---
SecRule REQUEST_URI|ARGS "@contains p2s_8512_shell.php" \
    "id:1006125,phase:2,block,log,auditlog,msg:'PHP-UP-2026: post-exploit webshell access',tag:'CVE-2026-109619',severity:'CRITICAL'"
SecRule RESPONSE_BODY "@rx (SHELL_ALIVE|PAYLOAD_PERSISTED)" \
    "id:1006126,phase:4,pass,log,auditlog,msg:'PHP-UP-2026: post-exploit marker in response',severity:'CRITICAL'"
