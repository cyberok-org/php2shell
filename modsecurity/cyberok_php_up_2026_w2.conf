# ModSecurity (v2/v3, OWASP CRS-compatible) rules — PHP-UP-2026-W2 (parsers & client-side).
# IDs 1006260-1006279 (local range). Inbound-only: the client-side CVEs in this section
# (CVE-2026-127960 folded headers, CVE-2026-128064 mixed-case HTTPS/FTPS, the SoapClient
# WSDL path of CVE-2026-129506) are outbound fetches made BY PHP and are not visible to a
# WAF in front of the application — see the Suricata rules and host-hunt scanner instead.
#
# Validated with owasp/modsecurity-crs:nginx (libmodsecurity v3 + CRS) on loopback.
# Install as a "before-crs" file (e.g. /opt/modsecurity/rules/before-crs/).
# Requires SecRequestBodyAccess On. Rules use "block" and add to the CRS inbound anomaly score
# (CRS 949110 then denies); without CRS, "block" follows your SecDefaultAction. Run with
# SecRuleEngine DetectionOnly (or switch to "pass,log") for a burn-in period first.

SecRequestBodyAccess On

# Note: anomaly-score setvar sits on the LAST rule of each chain — non-disruptive actions on a
# chain starter run as soon as the starter matches (lab: a starter-level setvar blocked every
# benign SOAP request that merely carried a SOAPAction header).

# Make the raw body available as REQUEST_BODY for SOAP/XML content types even though CRS
# rule 200000 switches the body processor to XML for them.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^(?:text/xml|application/soap\+xml|application/xml)" \
    "id:1006260,phase:1,pass,nolog,t:none,ctl:forceRequestBodyVariable=On"

# --- CVE-2026-129506 (GHSA-4646-p932-gw34) — SoapServer DTD-entity use-after-free -------------
# SOAP 1.1/1.2 forbid a DTD in a SOAP message: any DOCTYPE in a request to a SOAP endpoint
# (SOAPAction header or application/soap+xml, or an envelope namespace in the body) is a
# policy violation and the precondition of the UAF. FP: very low for SOAP endpoints.
SecRule &REQUEST_HEADERS:SOAPAction "@gt 0" \
    "id:1006261,phase:2,block,log,auditlog,t:none,msg:'PHP-UP-2026-W2 CVE-2026-129506: DTD in SOAP 1.1 request (SOAP forbids DTD - SoapServer DTD-entity UAF)',tag:'CVE-2026-129506',tag:'GHSA-4646-p932-gw34',severity:'CRITICAL',chain"
    SecRule REQUEST_BODY "@rx (?i)<!DOCTYPE" "t:none,setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule REQUEST_HEADERS:Content-Type "@rx (?i)application/soap\+xml" \
    "id:1006267,phase:2,block,log,auditlog,t:none,msg:'PHP-UP-2026-W2 CVE-2026-129506: DTD in SOAP 1.2 request (SOAP forbids DTD - SoapServer DTD-entity UAF)',tag:'CVE-2026-129506',tag:'GHSA-4646-p932-gw34',severity:'CRITICAL',chain"
    SecRule REQUEST_BODY "@rx (?i)<!DOCTYPE" "t:none,setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# Same, keyed on the body (SOAP envelope namespace) when no SOAP header is present —
# SoapServer::handle() does not require SOAPAction.
SecRule REQUEST_BODY "@rx (?is)<!DOCTYPE.{0,4096}?(?:schemas\.xmlsoap\.org/soap/envelope|www\.w3\.org/2003/05/soap-envelope)" \
    "id:1006262,phase:2,block,log,auditlog,t:none,setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',msg:'PHP-UP-2026-W2 CVE-2026-129506: DTD before SOAP envelope',tag:'CVE-2026-129506',tag:'GHSA-4646-p932-gw34',severity:'CRITICAL'"

# UTF-16 encoded DOCTYPE (libxml2 honours the BOM; plain-text filters miss it).
SecRule REQUEST_BODY "@rx (?i)!\x00D\x00O\x00C\x00T\x00Y\x00P\x00E|\x00!\x00D\x00O\x00C\x00T\x00Y\x00P\x00E" \
    "id:1006263,phase:2,block,log,auditlog,t:none,setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',msg:'PHP-UP-2026-W2 CVE-2026-129506: UTF-16 encoded DOCTYPE in XML request (DTD filter evasion)',tag:'CVE-2026-129506',tag:'GHSA-4646-p932-gw34',severity:'CRITICAL'"

# SoapServer::handle() inflates Content-Encoding gzip/deflate itself (needs ext/zlib), so a WAF
# that does not decompress request bodies sees none of the content above. Log (do not block)
# compressed SOAP requests so the blind spot is visible; block if your clients never compress.
SecRule REQUEST_HEADERS:Content-Encoding "@rx (?i)^\s*(?:x-)?(?:gzip|deflate)" \
    "id:1006264,phase:1,pass,log,auditlog,t:none,msg:'PHP-UP-2026-W2 CVE-2026-129506: compressed SOAP/XML request body (content not inspectable by WAF)',tag:'CVE-2026-129506',severity:'NOTICE',chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx (?i)(?:text/xml|application/soap\+xml)" "t:none"

# --- CVE-2026-15353 (GHSA-q23r-hr55-xmpg) — SOAP arraySize with no dimension -------------------
# Valid arraySize is "*", "N" or "N M ...". A value with no digit and no '*' makes PHP index a
# zero-length allocation and leak 4 bytes of heap as an array key. FP: none expected.
SecRule REQUEST_BODY "@rx arraySize\s*=\s*(?:\"[^\"0-9*]*\"|'[^'0-9*]*')" \
    "id:1006265,phase:2,block,log,auditlog,t:none,setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',msg:'PHP-UP-2026-W2 CVE-2026-15353: SOAP arraySize with no dimension (uninitialised heap read / info leak)',tag:'CVE-2026-15353',tag:'GHSA-q23r-hr55-xmpg',severity:'CRITICAL'"

# Evasion of the above via character/entity references inside arraySize.
SecRule REQUEST_BODY "@rx arraySize\s*=\s*(?:\"[^\"]*&|'[^']*&)" \
    "id:1006266,phase:2,block,log,auditlog,t:none,setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',msg:'PHP-UP-2026-W2 CVE-2026-15353: SOAP arraySize containing a character/entity reference',tag:'CVE-2026-15353',tag:'GHSA-q23r-hr55-xmpg',severity:'CRITICAL'"
