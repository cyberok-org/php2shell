# ModSecurity v2/v3 (OWASP CRS-compatible) rules for the 2026-11-19 release.
# ID space 1006200-1006299 (no overlap with cyberok_php_up_2026.conf). Load-tested
# together with CRS 4 on libmodsecurity 3.0.17. Include both files.

# ===== CVE-2026-129289 — PHP-FPM request smuggling =====
# ------------------------------------------------------------------------
# PHP-UP-2026-W2 — PHP-FPM request smuggling
# CVE-2026-129289 / GHSA-qc49-hpvq-g2w6 (critical)
# ModSecurity v2/v3 (OWASP CRS-compatible) rules. Local ID range 1006200-1006219.
# ------------------------------------------------------------------------
#
# Load BEFORE the CRS blocking evaluation (e.g. as
# REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf or right after crs-setup.conf):
# the high-confidence rules add to the CRS inbound anomaly score and use
# "block", which follows SecDefaultAction. Without CRS, "block" falls back to
# your SecDefaultAction (stock: pass) — change "block" to "deny,status:403"
# if you run them standalone.
#
# Wire facts (main/fastcgi.c): the smuggled request is raw FastCGI records;
# nothing between the client and PHP-FPM decodes the body, so the bytes are
# verbatim in REQUEST_BODY. PARAMS name-value pairs are length-prefixed and the
# NAME IS DIRECTLY CONCATENATED WITH THE VALUE — this keeps 1006202-1006204 off
# human-readable configs/docs that mention the same names.
#
# Coverage limits: SecRequestBodyLimit / SecRequestBodyNoFilesLimit (bytes past
# the limit with ProcessPartial are not inspected); TLS must be terminated
# before ModSecurity; known FP class = uploads of pcaps / FastCGI fixtures.

SecRequestBodyAccess On

# 1006200 — ModSecurity v2 fills REQUEST_BODY only for urlencoded bodies; force
# it for every request that can carry a body (multipart, octet-stream, JSON...).
SecRule REQUEST_METHOD "!@rx ^(?:GET|HEAD|OPTIONS)$" \
    "id:1006200,phase:1,pass,nolog,t:none,ctl:forceRequestBodyVariable=On"

# 1006201 — smuggled FastCGI request: BEGIN_REQUEST record + NV-encoded
# SCRIPT_FILENAME / PATH_TRANSLATED (fpm_main.c falls back to PATH_TRANSLATED).
SecRule REQUEST_BODY "@rx \x0f(?:[\x00-\x7f]|[\x80-\xff][\x00-\xff]{3})(?:SCRIPT_FILENAME|PATH_TRANSLATED)" \
    "id:1006201,phase:2,block,log,auditlog,t:none,severity:'CRITICAL',msg:'PHP-UP-2026-W2 CVE-2026-129289: FastCGI BEGIN_REQUEST + SCRIPT_FILENAME/PATH_TRANSLATED in request body (PHP-FPM request smuggling)',tag:'CVE-2026-129289',tag:'GHSA-qc49-hpvq-g2w6',chain"
    SecRule REQUEST_BODY "@rx [\x01-\xff]\x01[\x00-\xff]{2}\x00\x08[\x00-\xff]{2}\x00[\x01-\x03]" \
        "t:none,setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 1006202 — NV-encoded PHP_VALUE / PHP_ADMIN_VALUE carrying an ini "name=".
SecRule REQUEST_BODY "@rx (?:\x09(?:[\x00-\x7f]|[\x80-\xff][\x00-\xff]{3})PHP_VALUE|\x0f(?:[\x00-\x7f]|[\x80-\xff][\x00-\xff]{3})PHP_ADMIN_VALUE)[a-z_.]{3,64}\s*=" \
    "id:1006202,phase:2,block,log,auditlog,t:none,severity:'CRITICAL',msg:'PHP-UP-2026-W2 CVE-2026-129289: FastCGI PHP_VALUE/PHP_ADMIN_VALUE pair in request body (FPM ini injection)',tag:'CVE-2026-129289',tag:'GHSA-qc49-hpvq-g2w6',setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 1006203 — the advisory's code-exec chain directives inside that pair.
SecRule REQUEST_BODY "@rx (?:\x09|\x0f)(?:[\x00-\x7f]|[\x80-\xff][\x00-\xff]{3})PHP_(?:ADMIN_)?VALUE[^\x00]{0,512}?(?:auto_prepend_file|auto_append_file|allow_url_include|open_basedir|disable_functions|extension_dir|extension|include_path)\s*=" \
    "id:1006203,phase:2,block,log,auditlog,t:none,severity:'CRITICAL',msg:'PHP-UP-2026-W2 CVE-2026-129289: FastCGI PHP_VALUE with auto_prepend_file/allow_url_include (smuggling to code execution)',tag:'CVE-2026-129289',tag:'GHSA-qc49-hpvq-g2w6',setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 1006204 — forged client address: NV-encoded REMOTE_ADDR + IP literal, with a
# BEGIN_REQUEST record in the same body.
SecRule REQUEST_BODY "@rx \x0b(?:[\x02-\x2d]|[\x80-\xff]\x00\x00[\x02-\x2d])REMOTE_ADDR[0-9a-fA-F:.]{2,45}" \
    "id:1006204,phase:2,block,log,auditlog,t:none,severity:'CRITICAL',msg:'PHP-UP-2026-W2 CVE-2026-129289: FastCGI REMOTE_ADDR pair (forged client address) in request body',tag:'CVE-2026-129289',tag:'GHSA-qc49-hpvq-g2w6',chain"
    SecRule REQUEST_BODY "@rx [\x01-\xff]\x01[\x00-\xff]{2}\x00\x08[\x00-\xff]{2}\x00[\x01-\x03]" \
        "t:none,setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 1006205 — HUNTING: bare BEGIN_REQUEST(RESPONDER) + PARAMS record header within
# the padding window, no parameter anchor. Log only.
SecRule REQUEST_BODY "@rx [\x01-\xff]\x01[\x00-\xff]{2}\x00\x08[\x00-\xff]{2}\x00\x01[\x00-\xff]{6}[\x00-\xff]{0,255}?[\x01-\xff]\x04[\x00-\xff]{2}" \
    "id:1006205,phase:2,pass,log,auditlog,t:none,severity:'WARNING',msg:'PHP-UP-2026-W2 CVE-2026-129289 HUNTING: FastCGI BEGIN_REQUEST+PARAMS record pair in request body',tag:'CVE-2026-129289'"

# 1006206 — CONTEXT: multipart part whose Content-Disposition has neither
# name= nor filename= (PHP rfc1867 "garbled" early stop after the first 5120
# bytes = the advisory's positioning primitive). Detects the primitive, not a
# payload. Log only.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data" \
    "id:1006206,phase:2,pass,log,auditlog,t:none,severity:'NOTICE',msg:'PHP-UP-2026-W2 CVE-2026-129289 CONTEXT: multipart part without name/filename (PHP rfc1867 early-stop primitive)',tag:'CVE-2026-129289',chain"
    SecRule REQUEST_BODY "@rx (?i)(?:^|\n)Content-Disposition[ \t]*:[ \t]*form-data[ \t]*(?:;(?![ \t]*(?:file)?name[ \t]*=)[^;\r\n]*)*\r?\n" "t:none"

# ===== CVE-2026-115560 / 126714 / 129481 / 129182 / 129474 — session engine, fatal-backtrace lifetime =====
# ------------------------------------------------------------------------
# CyberOK — PHP-UP-2026-W2 (2026-11-19 PHP security release)
# ModSecurity v2/v3 (OWASP CRS-compatible). Local IDs 1006220-1006239.
#   CVE-2026-115560 GHSA-658j-r8rw-q6mx  session serializer mismatch via upload progress
#   CVE-2026-126714 GHSA-fm2m-fjf5-v3cp  partially overwritten session file
#   CVE-2026-129474 GHSA-8mjj-2r7p-4hg2  (posture: fatal backtraces with arguments)
# Companion to October 1006111/1006112/1006116 (keep them). Measured gaps
# closed here: C: (custom-serialized) objects, pipe seed deeper in the value,
# oversized progress values, the php-session record seam in ordinary fields
# (126714 splice seed, incl. JSON-escaped), escaped-quote filename carrier.
#
# High-confidence request rules use "block" (honours your SecDefaultAction /
# CRS anomaly mode); posture/anomaly rules are "pass,log". Requires
# SecRequestBodyAccess On; the phase:4 rules need SecResponseBodyAccess On with
# text/html + text/plain in SecResponseBodyMimeType.
# Validated in owasp/modsecurity-crs:nginx (ModSecurity v3).
# ------------------------------------------------------------------------

SecRequestBodyAccess On

# 115560: pipe + serialized value anywhere in the upload-progress value
# (php reader splits the key "upload_progress_<value>" at the first '|').
SecRule ARGS:PHP_SESSION_UPLOAD_PROGRESS "@rx \|(?:[OC]:\d{1,5}:\"|a:\d{1,7}:\{|s:\d{1,9}:\"|[iRrdb]:[\d-])" \
    "id:1006220,phase:2,block,t:none,log,auditlog,msg:'PHP-UP-2026-W2 CVE-2026-115560: serializer-mismatch seed (pipe + serialized value) in PHP_SESSION_UPLOAD_PROGRESS',tag:'CVE-2026-115560',severity:'CRITICAL'"

# 115560: object / custom-object syntax anywhere in the value (php_binary reader
# offset trick has no '|'; record-spanning payloads put the object in a later value)
SecRule ARGS:PHP_SESSION_UPLOAD_PROGRESS "@rx [OC]:\d{1,5}:\"[A-Za-z_\\\x80-\xff]" \
    "id:1006221,phase:2,block,t:none,log,auditlog,msg:'PHP-UP-2026-W2 CVE-2026-115560: serialized object syntax in PHP_SESSION_UPLOAD_PROGRESS',tag:'CVE-2026-115560',severity:'CRITICAL'"

# 115560/126714: oversized upload-progress value (legitimate ids are short)
SecRule ARGS:PHP_SESSION_UPLOAD_PROGRESS "@gt 512" \
    "id:1006222,phase:2,pass,t:none,t:length,log,auditlog,msg:'PHP-UP-2026-W2 CVE-2026-115560/126714: oversized PHP_SESSION_UPLOAD_PROGRESS value (>512 bytes)',tag:'CVE-2026-115560',tag:'CVE-2026-126714',severity:'WARNING'"

# 126714 (and generic session injection): php-session record seam  ";<name>|O:<n>:"
# in any argument, argument name, or the raw body (JSON-escaped quotes allowed).
SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx \\?\";[A-Za-z0-9_-]{0,64}\|[OC]:\d{1,5}:\\?\"" \
    "id:1006223,phase:2,block,t:none,t:urlDecodeUni,log,auditlog,msg:'PHP-UP-2026-W2 CVE-2026-126714: php-session record seam with object (session splice seed)',tag:'CVE-2026-126714',tag:'CVE-2026-115560',severity:'CRITICAL'"

# 115560 spanning carrier: filename with (escaped) string terminator + object.
# October 1006112 stops at the first escaped quote; this one does not.
SecRule FILES|REQUEST_BODY "@rx (?:filename=\"?[^\r\n]{0,512}?\\?\";[^\r\n]{0,64}[OC]:\d{1,5}:\\?\"|^[^\r\n]{0,512}\";[^\r\n]{0,64}[OC]:\d{1,5}:\")" \
    "id:1006224,phase:2,block,t:none,log,auditlog,msg:'PHP-UP-2026-W2 CVE-2026-115560: multipart filename with serialized terminator + object (spanning carrier)',tag:'CVE-2026-115560',severity:'CRITICAL'"

# 115560 post-patch signal: the application attempted a runtime session ini
# change while upload progress is enabled (fixed builds throw an Error).
SecRule RESPONSE_BODY "@contains cannot be changed at runtime when session.upload_progress.enabled is On" \
    "id:1006225,phase:4,pass,t:none,log,auditlog,msg:'PHP-UP-2026-W2 CVE-2026-115560: runtime session ini change rejected (upload progress explicitly enabled; app uses runtime-switch pattern)',tag:'CVE-2026-115560',severity:'NOTICE'"

# 129474 posture: fatal error backtrace WITH argument values in a response
# (fatal_error_backtraces=1 and zend.exception_ignore_args=0; PHP 8.5 prints it
# only with html_errors=0).
SecRule RESPONSE_BODY "@rx (?s)Fatal error.{0,600}Stack trace:(?:<br />)?\s*#0 (?:[^\r\n]{0,300}?\(\d+\)|\[internal function\]): [^\r\n(]{1,256}\((?:[\d'-]|&#0?39;|NULL|true|false|Array|Object)" \
    "id:1006226,phase:4,pass,t:none,log,auditlog,msg:'PHP-UP-2026-W2 CVE-2026-129474: fatal backtrace with arguments exposed (fatal_error_backtraces=1, exception_ignore_args=0)',tag:'CVE-2026-129474',severity:'NOTICE'"

# ===== CVE-2026-129496 / 129538 / 129292 — tzcache UAF, php-cgi PATH_INFO, FPM status XSS =====
# ------------------------------------------------------------------------
# CyberOK — PHP-UP-2026 wave 2 (PHP 8.2.36 / 8.3.37 / 8.4.28 / 8.5.13, 2026-11-19)
# SAPI / date: CVE-2026-129496, CVE-2026-129538, CVE-2026-129292
#
# (c) 2026 АО «Сайбер ОК» / JSC CyberOK
# Материал предоставляется исключительно для ознакомительных и исследовательских целей.
# Копирование, переработка, распространение, переопубликация и использование материала
# полностью или частично в коммерческих целях, включая создание и продвижение
# конкурирующих продуктов, запрещены без предварительного письменного разрешения
# правообладателя.
#
# Provided for informational and research purposes only. Copying, modification,
# distribution, republication, and use of this material in whole or in part for
# commercial purposes, including the creation and promotion of competing products,
# is prohibited without the prior written permission of the copyright holder.
# ------------------------------------------------------------------------
#
# ModSecurity v3 (libmodsecurity 3.0.x, OWASP CRS 4 container) rules. IDs 1006240-1006259.
# Validated in owasp/modsecurity-crs:nginx (DetectionOnly).
# Rules use "block": with CRS anomaly scoring they add to the score; standalone they deny
# per SecDefaultAction. Use "pass,log" for a burn-in period.
#
# NOTE SecArgumentsLimit: CRS images default to SecArgumentsLimit 1000 (+ rule 200007).
# ModSecurity stops collecting arguments at the limit, so the count rules below use
# "@ge 1000" (PHP warns at 1001; a request with exactly 1000 vars is a 1-off FP).

# =====================================================================================
# CVE-2026-129496 / GHSA-gr4f-wgx5-jpfv — DATEG(tzcache) UAF: early request diagnostics
# =====================================================================================
# Every rule here marks the transaction (tx.phpup_w2_earlydiag) for the 5xx correlation
# rule 1006246. Lower the thresholds to YOUR max_input_vars / max_file_uploads if changed.

SecRule &ARGS_GET "@ge 1000" \
    "id:1006240,phase:1,block,log,auditlog,t:none,msg:'PHP-UP-2026-W2 CVE-2026-129496: >=1000 query-string variables (max_input_vars early diagnostic)',tag:'CVE-2026-129496',severity:'WARNING',setvar:'tx.phpup_w2_earlydiag=1'"

# POST body: counted on the raw urlencoded body (with SecArgumentsLimit reached, libmodsecurity
# stops populating ARGS_POST, so "&ARGS_POST @ge 1000" does not fire — validated).
SecRule REQUEST_HEADERS:Content-Type "@rx ^application/x-www-form-urlencoded" \
    "id:1006241,phase:2,block,log,auditlog,t:none,t:lowercase,msg:'PHP-UP-2026-W2 CVE-2026-129496: >=1000 POST variables (max_input_vars early diagnostic)',tag:'CVE-2026-129496',severity:'WARNING',setvar:'tx.phpup_w2_earlydiag=1',chain"
    SecRule REQUEST_BODY "@rx ^(?:[^&]*+&){999}" "t:none"

SecRule &REQUEST_COOKIES "@ge 1000" \
    "id:1006242,phase:1,block,log,auditlog,t:none,msg:'PHP-UP-2026-W2 CVE-2026-129496: >=1000 cookie pairs (max_input_vars early diagnostic)',tag:'CVE-2026-129496',severity:'WARNING',setvar:'tx.phpup_w2_earlydiag=1'"

# multipart/form-data without boundary: "Missing boundary" at request startup — a few bytes
# crash a fresh vulnerable php-cgi worker (lab). Never produced by a conforming client.
SecRule REQUEST_HEADERS:Content-Type "@rx ^\s*multipart/form-data(?![^\r\n]*boundary=)" \
    "id:1006243,phase:1,block,log,auditlog,t:none,t:lowercase,msg:'PHP-UP-2026-W2 CVE-2026-129496: multipart/form-data without boundary (early request diagnostic)',tag:'CVE-2026-129496',severity:'WARNING',setvar:'tx.phpup_w2_earlydiag=1'"

# >20 file parts (max_file_uploads default). Multi-upload UIs may exceed this: tune.
SecRule &FILES "@gt 20" \
    "id:1006244,phase:2,block,log,auditlog,t:none,msg:'PHP-UP-2026-W2 CVE-2026-129496: >20 file parts (max_file_uploads early diagnostic)',tag:'CVE-2026-129496',severity:'NOTICE',setvar:'tx.phpup_w2_earlydiag=1'"

# Oversized Basic credential (advisory exploit-chain shape). Negotiate/Bearer not matched.
SecRule REQUEST_HEADERS:Authorization "@rx ^Basic\s+[A-Za-z0-9+/=]{1024,}" \
    "id:1006245,phase:1,block,log,auditlog,t:none,msg:'PHP-UP-2026-W2 CVE-2026-129496: oversized HTTP Basic credential (>1KB, exploit-chain shape)',tag:'CVE-2026-129496',severity:'WARNING'"

# Input nesting deeper than max_input_nesting_level=64 (diagnostic only when display_errors=Off).
SecRule ARGS_NAMES "@rx (?:\[[^\]]{0,64}\]){65}" \
    "id:1006247,phase:2,block,log,auditlog,t:none,msg:'PHP-UP-2026-W2 CVE-2026-129496: input variable nested >64 levels (early request diagnostic)',tag:'CVE-2026-129496',severity:'WARNING',setvar:'tx.phpup_w2_earlydiag=1'"

# Impact correlation (logging phase): upstream 502/503/504 for a transaction that carried an
# early-diagnostic shape = a PHP worker likely died while starting that request.
SecRule RESPONSE_STATUS "@rx ^50[234]$" \
    "id:1006246,phase:5,pass,log,auditlog,t:none,msg:'PHP-UP-2026-W2 CVE-2026-129496: gateway error after early-diagnostic request (possible PHP worker crash)',tag:'CVE-2026-129496',severity:'CRITICAL',chain"
    SecRule TX:PHPUP_W2_EARLYDIAG "@eq 1" "t:none"

# =====================================================================================
# CVE-2026-129538 / GHSA-5j3f-64r7-f564 — php-cgi PATH_INFO underflow
# =====================================================================================
# The advisory's Apache shape is an ordinary request ("GET /news/x"): no WAF signature can
# separate it. Only the deep-suffix DoS/leak shape against unsplit mappings is matchable.
SecRule REQUEST_FILENAME "@rx \.php/[^?#]{2048}" \
    "id:1006250,phase:1,block,log,auditlog,t:none,t:lowercase,msg:'PHP-UP-2026-W2 CVE-2026-129538: >=2KB path suffix after .php (PATH_INFO underflow distance)',tag:'CVE-2026-129538',severity:'WARNING'"

# =====================================================================================
# CVE-2026-129292 / GHSA-3mg3-cr28-46gc — FPM full-status XSS (method/user/script)
# =====================================================================================
# Planting request: markup in the Basic USERNAME (before the first ':'). Password chars ignored.
SecRule REQUEST_HEADERS:Authorization "@rx ^Basic\s+([A-Za-z0-9+/=]{4,256})" \
    "id:1006255,phase:1,block,log,auditlog,capture,t:none,msg:'PHP-UP-2026-W2 CVE-2026-129292: markup in HTTP Basic username (FPM status XSS planting)',tag:'CVE-2026-129292',severity:'CRITICAL',chain"
    SecRule TX:1 "@rx ^[^:]{0,63}[<>\x22]" "t:none,t:base64Decode"

# Planting request: markup in the requested .php script name (recorded verbatim with
# cgi.fix_pathinfo=0 even for a non-existent file).
SecRule REQUEST_FILENAME "@rx <[a-z!/][^?]*\.php(?:/|$)" \
    "id:1006256,phase:1,block,log,auditlog,t:none,t:urlDecodeUni,t:lowercase,msg:'PHP-UP-2026-W2 CVE-2026-129292: markup in requested .php script name (FPM status XSS planting)',tag:'CVE-2026-129292',severity:'CRITICAL'"

# Status page DELIVERING raw markup in a process cell (vulnerable FPM). Needs response body
# access for text/html (and text/xml).
SecRule RESPONSE_BODY "@contains <th>request method</th>" \
    "id:1006257,phase:4,block,log,auditlog,t:none,msg:'PHP-UP-2026-W2 CVE-2026-129292: FPM status page serves raw markup in a process field (stored XSS)',tag:'CVE-2026-129292',severity:'CRITICAL',chain"
    SecRule RESPONSE_BODY "@rx <td>[^<]{0,63}<(?:svg|img|script|iframe|body|details|video|audio|math|style|input|form|object|embed|a|marquee|xmp|template|select|textarea)[\s/>]" "t:none,t:lowercase"

# JSON status carrying markup in user/script/method (residual on PATCHED builds for innerHTML
# consumers such as the bundled status.html). Needs application/json in SecResponseBodyMimeType.
SecRule RESPONSE_BODY "@rx \x22processes\x22:\[" \
    "id:1006258,phase:4,block,log,auditlog,t:none,msg:'PHP-UP-2026-W2 CVE-2026-129292: FPM JSON status carries markup in user/script/method',tag:'CVE-2026-129292',severity:'WARNING',chain"
    SecRule RESPONSE_BODY "@rx \x22(?:user|script|request method)\x22:\x22(?:[^\x22\x5c<]|\x5c.){0,63}\x22?(?:<|\x5cu003c)[a-z!/]" "t:none,t:lowercase"

# ===== CVE-2026-129506 / 15353 / 129501 / 127960 / 128064 / 128090 / 129438 — SOAP, DOM, client-side, phar =====
